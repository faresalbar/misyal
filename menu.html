<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو مسيال · Menu Misyaal</title>
<meta name="description" content="منيو مسيال — المشروبات الساخنة والباردة والمقطرة، الحلا، وفطور مسيال. Prices in SAR, VAT included.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#F7EEDC;color:#0C4A3E;-webkit-font-smoothing:antialiased}
a{color:#0C4A3E;text-decoration:none}
a:hover{color:#B06A2C}
@keyframes rev{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
::selection{background:#0C4A3E;color:#F7EEDC}
.h-lang:hover{background:#0C4A3E !important;color:#F7EEDC !important}
.m-tab:hover{border-color:#0C4A3E !important}
.m-size:hover{border-color:#0C4A3E !important}
</style>
</head>
<body>
<div style="font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;background:#F7EEDC;color:#0C4A3E">

  <header style="position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px;background:rgba(247,238,220,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(12,74,62,.13)">
    <a href="index.html" style="display:flex;align-items:baseline;gap:10px">
      <span style="font-family:'Aref Ruqaa',serif;font-size:30px;font-weight:700;color:#0C4A3E">مسيال</span>
      <span style="font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.34em;color:rgba(12,74,62,.6)">MISYAAL</span>
    </a>
    <nav style="display:flex;align-items:center;gap:26px;font-size:14px">
      <a href="index.html" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
      <a href="index.html#hours" data-ar="أوقات العمل" data-en="Hours">أوقات العمل</a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="MISYAAL.toggle()" class="h-lang" style="cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.18em;padding:9px 16px;border:1px solid rgba(12,74,62,.3);border-radius:999px;background:transparent;color:#0C4A3E" data-ar="EN" data-en="ع">EN</button>
    </div>
  </header>

  <section style="padding:64px 24px 30px;text-align:center">
    <p style="margin:0 0 12px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.4em;color:#B06A2C">MENU MISYAAL</p>
    <h1 style="margin:0;font-family:'Aref Ruqaa',serif;font-size:clamp(42px,7.4vw,84px);font-weight:700;line-height:1.25" data-ar="منيو مسيال" data-en="Menu Misyaal">منيو مسيال</h1>
    <p style="margin:16px auto 0;max-width:520px;font-size:15px;line-height:1.8;color:rgba(12,74,62,.66)" data-ar="الأسعار بالريال السعودي · شامل الضريبة" data-en="Prices in SAR · VAT included">الأسعار بالريال السعودي · شامل الضريبة</p>
  </section>

  <div style="position:sticky;top:63px;z-index:50;background:rgba(247,238,220,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(12,74,62,.1)">
    <div id="tabs" style="max-width:1040px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:14px 24px"></div>
  </div>

  <main id="menu" style="max-width:1040px;margin:0 auto;padding:48px 24px 120px;text-align:start"></main>

</div>

<script src="app.js"></script>
<script>
/* ===== Original Misyaal menu data (verbatim from source) ===== */
var COPY = {
  ar: { title:"منيو مسيال", sub:"الأسعار بالريال السعودي · شامل الضريبة" },
  en: { title:"Menu Misyaal", sub:"Prices in SAR · VAT included" }
};
var TABLABEL = {
  all:  { ar:"الكل", en:"All" }
};
var POPULAR = ["hot7","cold8","drip0","sweets6"];
var SIZES = { ar:["صغير","وسط","كبير"], en:["Small","Medium","Large"] };
var M = [
  { id:"hot", ar:"المشروبات الساخنة", en:"Hot Drinks", latin:"HOT", items:[
    ["امريكانو","Americano",12],["كورتادو","Cortado",13],["هوت شوكلت","Hot Chocolate",15],
    ["ميكاتو","Micato",13],["لاتيه","Latte",16],["كابتشينو","Cappuccino",16],
    ["فلات وايت","Flat White",14],["سبانش لاتيه","Spanish Latte",16],
    ["لاتيه القرفة","Cinnamon Latte",16],["هوت ألفريدو","Hot Alfredo",10]]},
  { id:"cold", ar:"المشروبات الباردة", en:"Cold Drinks", latin:"COLD", items:[
    ["ايس لاتيه","Ice Latte",16],["ايس أمريكانو","Ice Americano",12],["ايس إسبانش لاتيه","Ice Spanish Latte",16],
    ["ايس ألفريدو","Ice Alfredo",10],["موهيتو أزرق","Blue Mojito",18],["كركديه","Rosella",17],
    ["ايس تي","Ice Tea",16],["ايس ماتشا","Ice Matcha",17],["ايس ماتشا ازرق","Ice Matcha Blue",20],
    ["ايس شوكو مسيال","Ice Chocolate",19]]},
  { id:"drip", sized:true, ar:"المشروبات المقطرة", en:"Drip Drinks", latin:"DRIP", items:[
    ["V60","V60",15,"15 · 16 · 18"],["ايس V60","Ice V60",15,"15 · 16 · 18"],
    ["قهوة اليوم","Coffee of the day",10],["ايس قهوة اليوم","Ice coffee of the day",10],
    ["بوكس قهوة اليوم","Box coffee of the day",56]]},
  { id:"sweets", ar:"الحلا", en:"Desserts", latin:"SWEETS", items:[
    ["بسبوسة مسيال","Basbousa Misyaal",14,null,null,null,"sweets/basbousa.png"],["كوكيز","Cookies",16,null,["ايسكريم - شوكلت","Ice cream · chocolate"],null,"sweets/cookies.png"],
    ["بيكان مسيال","Pecan Misyaal",24,null,null,null,"sweets/pecan.png"],["بودينق مسيال","Misyaal Pudding",25,null,null,{ar:["شوكلت","كندر","مكس"],en:["Chocolate","Kinder","Mix"],prices:[25,25,28]},"sweets/pudding.png"],
    ["دلوتشي كيك","Dolce Cake",25,null,null,null,"sweets/dolce.png"],["فرنش توست","French Toast",16,"16 – 20",["قشطة عسل - شوكلاته - بستاشيو كندر","Honey cream · chocolate · pistachio kinder"],null,"sweets/french.png"],
    ["تيراميسو","Tiramisu",25,null,null,null,"sweets/tiramisu.png"]]},
  { id:"food", ar:"فطور مسيال", en:"Breakfast Misyaal", latin:"BREAKFAST", items:[
    ["تونة مسيال","Tuna Misyaal",19,null,["ساندويتش تونة مع شرائح الزيتون والصوصات الخاصة","Tuna sandwich with olives & house sauces"],null,"uploads/assets-1787937089938-kfcq.jpeg"],
    ["حلومي بيستو","Halloumi Pesto",20,null,["ساندويتش الحلوم المشوي مع صوص البيستو والطماطم المجففة","Grilled halloumi with pesto & sun-dried tomato"],null,"uploads/assets-1787937089959-hclk.jpeg"],
    ["قريل أومليت تشيز","Grill Omelette Cheese",19,null,["ساندوتش اومليت مع الخلطة الفرنسية","Omelette sandwich, French-style blend"],null,"uploads/assets-1787937089954-9gd3.jpeg"]]}
];

/* ===== Theme (cream) + density (standard) + style (list) — original defaults ===== */
var TH = { paper:"#F7EEDC", ink:"#0C4A3E", line:"rgba(12,74,62,.14)", muted:"rgba(12,74,62,.55)", card:"rgba(255,255,255,.5)", accent:"#B06A2C" };
var D = { row:"15px 4px", gap:"2px 44px", sec:"64px", col:"320px" };
var S = { rowBg:"transparent", rowBorder:"0", rowBottom:"1px solid "+TH.line, radius:"0", nameSize:"17px", priceSize:"21px", pad:D.row };

var state = { tab:"all", sizes:{} };

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function L(){ return window.MISYAAL ? window.MISYAAL.lang : "ar"; }

function itemView(g, it, i){
  var lang = L();
  var key = g.id + i;
  var name = lang === "ar" ? it[0] : it[1];
  var variants = it[5];
  var sizable = g.sized;
  var explicit = (sizable && it[3])
    ? String(it[3]).split("·").join("–").split("–").map(function(s){return parseInt(s.trim(),10);}).filter(function(n){return !isNaN(n);})
    : null;
  var prices = variants ? variants.prices
    : (explicit && explicit.length === 3 ? explicit.slice().sort(function(a,b){return a-b;}) : null);
  var labels = variants ? variants[lang].slice() : (prices ? SIZES[lang].slice() : []);
  var sel = (state.sizes[key] != null) ? state.sizes[key] : (variants ? 0 : 1);
  var unit = prices ? prices[sel] : it[2];
  var sub = it[4] ? (lang === "ar" ? it[4][0] : it[4][1]) : "";
  var popular = POPULAR.indexOf(key) > -1;
  var img = it[6] || null;
  var hasImg = !!it[6];
  var popularLabel = lang === "ar" ? "الأكثر طلبًا" : "Most ordered";
  var price = prices ? String(unit) : (it[3] || String(it[2]));
  var hasSizes = !!prices;

  var html = '<div style="display:flex;align-items:center;gap:14px;text-align:start;padding:'+S.pad+';background:'+S.rowBg+';border:'+S.rowBorder+';border-bottom:'+S.rowBottom+';border-radius:'+S.radius+'">';
  if (hasImg) {
    html += '<div role="img" aria-label="'+esc(name)+'" style="flex:none;width:64px;height:64px;border-radius:12px;background-image:url('+esc(img)+');background-size:cover;background-position:center"></div>';
  }
  html += '<div style="flex:1;min-width:0">';
  html +=   '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
  html +=     '<p style="margin:0;font-size:'+S.nameSize+'">'+esc(name)+'</p>';
  if (popular) {
    html +=   '<span style="font-size:10.5px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:'+TH.accent+';color:#F7EEDC">'+esc(popularLabel)+'</span>';
  }
  html +=   '</div>';
  if (sub) {
    html +=  '<p style="margin:3px 0 0;font-size:12.5px;color:'+TH.muted+'">'+esc(sub)+'</p>';
  }
  if (hasSizes) {
    html += '<div style="display:flex;gap:6px;margin-top:8px">';
    for (var si=0; si<prices.length; si++){
      var on = si === sel;
      var bg = on ? "#0C4A3E" : "transparent";
      var fg = on ? "#F7EEDC" : "rgba(12,74,62,.7)";
      html += '<button class="m-size" data-key="'+esc(key)+'" data-idx="'+si+'" style="cursor:pointer;font-family:\'Tajawal\',sans-serif;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid rgba(12,74,62,.25);background:'+bg+';color:'+fg+'">'+esc(labels[si])+'</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  html += '<span style="font-family:\'Cormorant Garamond\',serif;font-size:'+S.priceSize+';color:'+TH.ink+';white-space:nowrap">'+esc(price)+'</span>';
  html += '</div>';
  return html;
}

function render(){
  var lang = L();
  var t = COPY[lang];

  // Title + subtitle (kept in sync; also covered by data attributes)
  // Tabs
  var tabsSrc = [{ id:"all", ar:TABLABEL.all.ar, en:TABLABEL.all.en }].concat(
    M.map(function(g){ return { id:g.id, ar:g.ar, en:g.en }; })
  );
  var tabsHtml = "";
  tabsSrc.forEach(function(tb){
    var on = state.tab === tb.id;
    var bg = on ? TH.ink : "transparent";
    var fg = on ? TH.paper : TH.ink;
    var label = lang === "ar" ? tb.ar : tb.en;
    tabsHtml += '<button class="m-tab" data-tab="'+esc(tb.id)+'" style="cursor:pointer;white-space:nowrap;font-family:\'Tajawal\',sans-serif;font-size:14px;padding:10px 22px;border-radius:999px;border:1px solid rgba(12,74,62,.25);background:'+bg+';color:'+fg+'">'+esc(label)+'</button>';
  });
  document.getElementById("tabs").innerHTML = tabsHtml;

  // Groups
  var shown = M.filter(function(g){ return state.tab === "all" || state.tab === g.id; });
  var mainHtml = "";
  shown.forEach(function(g){
    var title = lang === "ar" ? g.ar : g.en;
    mainHtml += '<section style="margin-bottom:'+D.sec+';animation:rev .5s both">';
    mainHtml +=   '<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:22px">';
    mainHtml +=     '<h2 style="margin:0;font-family:\'Amiri\',serif;font-size:clamp(28px,3.6vw,40px);font-weight:700">'+esc(title)+'</h2>';
    mainHtml +=     '<span style="flex:1;height:1px;background:rgba(12,74,62,.2)"></span>';
    mainHtml +=     '<span style="font-family:\'Cormorant Garamond\',serif;font-size:12px;letter-spacing:.3em;color:rgba(12,74,62,.5)">'+esc(g.latin)+'</span>';
    mainHtml +=   '</div>';
    mainHtml +=   '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax('+D.col+',1fr));gap:'+D.gap+'">';
    g.items.forEach(function(it,i){ mainHtml += itemView(g, it, i); });
    mainHtml +=   '</div>';
    mainHtml += '</section>';
  });
  document.getElementById("menu").innerHTML = mainHtml;

  // Wire tab + size interactions
  document.querySelectorAll("#tabs .m-tab").forEach(function(btn){
    btn.addEventListener("click", function(){ state.tab = btn.getAttribute("data-tab"); render(); });
  });
  document.querySelectorAll("#menu .m-size").forEach(function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-key");
      state.sizes[k] = parseInt(btn.getAttribute("data-idx"), 10);
      render();
    });
  });
}

// Re-render when language changes (names, prices, labels, descriptions all update)
window.onLangChange = function(){ render(); };
document.addEventListener("DOMContentLoaded", render);
render();
</script>
</body>
</html>
